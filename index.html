<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MŮJ TRÉNINK – TEST app.js</title>
<style>
body{font-family:Arial,sans-serif;background:#fff;color:#111;padding:20px;line-height:1.45}
h1{font-size:24px;margin-bottom:6px}
h2{font-size:18px;margin-top:24px}
.box{border:1px solid #bbb;border-radius:10px;padding:14px;margin:12px 0;word-break:break-word}
.ok{color:#087a20}.bad{color:#b00020}.mono{font-family:monospace;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>MŮJ TRÉNINK – TEST app.js</h1>
<p>Tento test pouze ověřuje, zda GitHub Pages správně doručuje soubor <b>app.js</b>. Aplikaci nespouští.</p>
<div id="result" class="box">Testuji načtení app.js…</div>
<div id="details" class="box"></div>

<script>
(async function(){
  const result=document.getElementById('result');
  const details=document.getElementById('details');
  const url='app.js?v=loadtest70&_=' + Date.now();
  try{
    const response=await fetch(url,{cache:'no-store'});
    const text=await response.text();
    let out='';
    out += '<b>HTTP status:</b> '+response.status+'<br>';
    out += '<b>OK:</b> '+response.ok+'<br>';
    out += '<b>Content-Type:</b> '+(response.headers.get('content-type')||'(neuveden)')+'<br>';
    out += '<b>URL odpovědi:</b> '+response.url+'<br>';
    out += '<b>Délka app.js:</b> '+text.length+' znaků<br><br>';
    out += '<b>Prvních 500 znaků:</b><div class="mono">'+
      text.slice(0,500).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+
      '</div>';
    details.innerHTML=out;

    if(!response.ok){
      result.className='box bad';
      result.innerHTML='<b>✗ app.js se nepodařilo načíst.</b>';
      return;
    }

    try{
      new Function(text);
      result.className='box ok';
      result.innerHTML='<b>✓ app.js byl načten a syntakticky je v pořádku.</b>';
    }catch(e){
      result.className='box bad';
      result.innerHTML='<b>✗ app.js byl načten, ale obsahuje chybu syntaxe.</b><br><span class="mono">'+
        String(e).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+
        '</span>';
    }
  }catch(e){
    result.className='box bad';
    result.innerHTML='<b>✗ Fetch app.js selhal.</b><br><span class="mono">'+
      String(e).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+
      '</span>';
    details.innerHTML='<b>Požadovaná URL:</b> '+url;
  }
})();
</script>
</body>
</html>
